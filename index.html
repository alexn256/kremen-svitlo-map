<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Світло Кременчук — карта відключень</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="left-stack" class="left-stack">
      <div id="app-title" class="app-title"></div>
      <div id="queue-panel" class="queue-panel" role="group" aria-label="Виділити чергу"></div>
      <div id="timeline-panel" class="timeline-panel" role="group" aria-label="Час доби">
        <div id="timeline-time" class="timeline-time"></div>
        <div class="timeline-track">
          <div class="timeline-slider-box">
            <input
              type="range"
              id="timeline-slider"
              class="timeline-slider"
              min="0"
              max="1439"
              step="30"
            />
          </div>
          <div class="timeline-ticks" aria-hidden="true">
            <span style="top: 0%">00</span>
            <span style="top: 8.3333%">02</span>
            <span style="top: 16.6667%">04</span>
            <span style="top: 25%">06</span>
            <span style="top: 33.3333%">08</span>
            <span style="top: 41.6667%">10</span>
            <span style="top: 50%">12</span>
            <span style="top: 58.3333%">14</span>
            <span style="top: 66.6667%">16</span>
            <span style="top: 75%">18</span>
            <span style="top: 83.3333%">20</span>
            <span style="top: 91.6667%">22</span>
            <span style="top: 100%">24</span>
          </div>
        </div>
        <button type="button" id="timeline-live-btn" class="timeline-live-btn">⏺ Live</button>
      </div>
    </div>

    <div id="status-bar" class="status-bar" aria-live="polite"></div>
    <footer id="app-footer" class="app-footer"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
